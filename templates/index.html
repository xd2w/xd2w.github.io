{% extends "base.html" %}
{% block content %}

<header class="hero">
  <div class="wrap reveal">
    <h1>{{ t.hero_title }}</h1>
    <p>{{ t.hero_subtitle }}</p>
  </div>
</header>

<section>
  <div class="wrap reveal">
    <h2>{{ t.projects_heading }}</h2>
    <div class="project-grid">
      {% for project in t.projects %}
      <a class="card" href="{{ project.href | default('404.html') }}">
        <h3>{{ project.title }}</h3>
        <p>{{ project.summary }}</p>
      </a>
      {% endfor %}
    </div>
  </div>
</section>

{% if body.strip() %}
<section>
  <div class="wrap reveal markdown">{{ body|safe }}</div>
</section>
{% endif %}

{% endblock %}
